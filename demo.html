<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Map</title>
</head>
<body>

    <!--
    https://github.com/user-attachments/assets/be76bfc6-c851-42e8-891b-497b0276e8d8
    https://github.com/user-attachments/assets/f075d0d7-77ce-44b0-b650-fa11f2d01603
    -->

    <img
        id="mainImage"
        src="https://github.com/user-attachments/assets/be76bfc6-c851-42e8-891b-497b0276e8d8"
        usemap="#image-map"
        alt="Map Image"
    >

    <map name="image-map">
        <area
            shape="rect"
            coords="34,44,270,350"
            href="#"
            onclick="changeImage('image1.jpg'); return false;"
            alt="Region 1"
        >

        <area
            shape="circle"
            coords="130,136,60"
            href="#"
            onclick="changeImage('https://github.com/user-attachments/assets/f075d0d7-77ce-44b0-b650-fa11f2d01603'); return false;"
            alt="Region 2"
        >

        <area
            shape="poly"
            coords="300,50,400,150,350,200"
            href="#"
            onclick="changeImage('image3.jpg'); return false;"
            alt="Region 3"
        >
    </map>

    <script>
        function changeImage(newSrc) {
            document.getElementById("mainImage").src = newSrc;
        }
    </script>

</body>
</html>
