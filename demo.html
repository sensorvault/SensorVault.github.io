<div style="text-align:center;">
<p style="text-align:center; font-weight:bold; margin-bottom:10px;">
    This is a demo to display the features of the app. Click on the red circles to see each feature
</p>
    
    <div style="position:relative; display:inline-block;">

    <img
        id="mainImage"
        src="https://github.com/user-attachments/assets/be76bfc6-c851-42e8-891b-497b0276e8d8"
        alt="Map Image"
        style="width:400px; max-width:100%; height:auto; display:block;"
    >

    <!-- CLICKABLE CIRCLE 1 (FIRST IMAGE ONLY) -->
    <div id="hotspot1"
        onclick="changeImage('https://github.com/user-attachments/assets/f075d0d7-77ce-44b0-b650-fa11f2d01603')"
        style="
            position:absolute;
            top:805.5px;
            left:347.5px;
            width:40px;
            height:40px;
            border-radius:50%;
            background:rgba(200,0,100,0.6);
            border: 2px solid white;
            cursor:pointer;
        ">
    </div>

    <!-- CLICKABLE CIRCLE 2 (SECOND IMAGE ONLY) -->
    <div id="hotspot2"
        onclick="changeImage('https://github.com/user-attachments/assets/be76bfc6-c851-42e8-891b-497b0276e8d8')"
        style="
            position:absolute;
            top:85px;
            left:330px;
            width:40px;
            height:40px;
            border-radius:50%;
            background:rgba(200,0,100,0.6);
            border: 2px solid white;
            cursor:pointer;
            display:none;
        ">
    </div>

</div>

<script>
window.changeImage = function(newSrc) {
    document.getElementById("mainImage").src = newSrc;

    // FIRST IMAGE
    if (newSrc.includes("be76bfc6")) {
        document.getElementById("hotspot1").style.display = "block";
        document.getElementById("hotspot2").style.display = "none";
    }

    // SECOND IMAGE
    else if (newSrc.includes("f075d0d7")) {
        document.getElementById("hotspot1").style.display = "none";
        document.getElementById("hotspot2").style.display = "block";
    }
}
</script>
